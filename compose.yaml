name: sakura-vape

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  ADMIN_TELEGRAM_ID: ${ADMIN_TELEGRAM_ID:?Set ADMIN_TELEGRAM_ID in .env}
  MANAGER_TELEGRAM_ID: ${MANAGER_TELEGRAM_ID:?Set MANAGER_TELEGRAM_ID in .env}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
  DATABASE_URL: postgresql://${POSTGRES_USER:-sakura}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sakura_vape}?schema=public

services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.35
    logging: *default-logging
    networks:
      - edge
      - backend

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    init: true
    environment: *api-environment
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 384m
    cpus: 0.6
    logging: *default-logging
    networks:
      - edge
      - backend

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.6
    logging: *default-logging
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sakura_vape}
      POSTGRES_USER: ${POSTGRES_USER:-sakura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - max_connections=50
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sakura} -d ${POSTGRES_DB:-sakura_vape}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    mem_limit: 640m
    cpus: 0.8
    logging: *default-logging
    networks:
      - backend

networks:
  edge:
  backend:
    internal: true

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
