name: Check Docker production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: shop.example.com
      PUBLIC_APP_URL: https://shop.example.com/
      POSTGRES_DB: sakura_vape
      POSTGRES_USER: sakura
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      ADMIN_TELEGRAM_ID: "777000"
      OWNER_TELEGRAM_ID: "777000"
      MANAGER_TELEGRAM_ID: "777000"
      TELEGRAM_BOT_TOKEN: "ci-placeholder-token"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Validate Caddyfile
        run: docker compose run --rm --no-deps --entrypoint caddy gateway validate --config /etc/caddy/Caddyfile --adapter caddyfile

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
