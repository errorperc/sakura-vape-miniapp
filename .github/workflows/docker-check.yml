name: Check Docker production build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_DOMAIN: api.185-246-217-69.sslip.io
      PUBLIC_APP_URL: https://errorperc.github.io/sakura-vape-miniapp/
      POSTGRES_DB: sakura_vape
      POSTGRES_USER: sakura
      POSTGRES_PASSWORD: 0123456789abcdef0123456789abcdef
      ADMIN_TELEGRAM_ID: "777000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
